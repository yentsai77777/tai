<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>1970 泰源事件：山海交界的自由約定｜互動歷史推進導覽</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&family=Zen+Maru+Gothic:wght@500;700;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg-cream: #FAF7F2;
      --ink-black: #2C2A29;
      --sage-green: #E2ECE4;
      --coral-pink: #E8998D;
      --warm-yellow: #F7E8C4;
      --ocean-blue: #D9E4EC;
      --font-scale: 1;
    }

    body {
      background-color: #E5E0D5;
      color: var(--ink-black);
      font-family: 'Zen Maru Gothic', 'Noto Sans TC', sans-serif;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
    }

    /* 長輩大字模式縮放控制 */
    body.large-text-mode {
      --font-scale: 1.18;
    }
    .scale-text-xs { font-size: calc(0.76rem * var(--font-scale)); line-height: 1.45; }
    .scale-text-sm { font-size: calc(0.88rem * var(--font-scale)); line-height: 1.6; }
    .scale-text-base { font-size: calc(1rem * var(--font-scale)); line-height: 1.7; }
    .scale-text-lg { font-size: calc(1.16rem * var(--font-scale)); line-height: 1.45; }
    .scale-text-xl { font-size: calc(1.32rem * var(--font-scale)); line-height: 1.35; }

    /* 手機版置中容器 */
    .phone-frame {
      max-width: 520px;
      min-height: 100vh;
      margin: 0 auto;
      background-color: var(--bg-cream);
      border-left: 3px solid var(--ink-black);
      border-right: 3px solid var(--ink-black);
      box-shadow: 0 12px 40px rgba(44, 42, 41, 0.18);
      position: relative;
      display: flex;
      flex-direction: column;
      padding-bottom: 108px;
    }

    @media (max-width: 540px) {
      .phone-frame {
        border-left: none;
        border-right: none;
      }
    }

    /* 奶油手繪風粗黑框與立體硬陰影 */
    .sketch-box {
      border: 2.5px solid var(--ink-black);
      border-radius: 18px;
      box-shadow: 4px 4px 0px var(--ink-black);
      transition: transform 0.15s ease, box-shadow 0.15s ease, background-color 0.2s ease;
    }

    .sketch-btn:active:not(:disabled) {
      transform: translate(2px, 2px);
      box-shadow: 1.5px 1.5px 0px var(--ink-black);
    }

    .sketch-btn:hover:not(:disabled) {
      transform: translate(-1px, -1px);
      box-shadow: 5px 5px 0px var(--ink-black);
    }

    .sketch-pill {
      border: 2px solid var(--ink-black);
      border-radius: 9999px;
      box-shadow: 2px 2px 0px var(--ink-black);
    }

    /* 手繪螢光筆底線 */
    .highlight-coral {
      display: inline;
      background-image: linear-gradient(transparent 60%, #F5C2B8 60%);
      background-repeat: no-repeat;
      background-size: 100% 95%;
      padding: 0 2px;
    }

    .highlight-yellow {
      display: inline;
      background-image: linear-gradient(transparent 58%, #F7E09E 58%);
      background-repeat: no-repeat;
      background-size: 100% 95%;
      padding: 0 2px;
    }

    .highlight-blue {
      display: inline;
      background-image: linear-gradient(transparent 60%, #C5DCEB 60%);
      background-repeat: no-repeat;
      background-size: 100% 95%;
      padding: 0 2px;
    }

    /* 進度軸上方移動小標誌動畫 */
    .stepper-mascot {
      transition: left 0.38s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    /* 換幕淡入與微幅上浮動畫 */
    @keyframes stageReveal {
      0% {
        opacity: 0;
        transform: translateY(10px) scale(0.99);
      }
      100% {
        opacity: 1;
        transform: translateY(0) scale(1);
      }
    }
    .stage-animate {
      animation: stageReveal 0.32s cubic-bezier(0.22, 1, 0.36, 1) forwards;
    }

    /* 復古檔案夾格紋紙 */
    .archive-paper {
      background-color: #FFFDF7;
      background-image: linear-gradient(transparent 94%, #E7DEC8 94%);
      background-size: 100% 1.9rem;
      border: 2px dashed var(--ink-black);
      border-radius: 14px;
    }

    @keyframes pulseSpeaking {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.06); }
    }
    .speaking-active {
      animation: pulseSpeaking 1.1s infinite ease-in-out;
    }
  </style>
</head>
<body>

  <div class="phone-frame" id="appContainer">
    <!-- 頂部專題橫幅 -->
    <div class="bg-[#2C2A29] text-[#FAF7F2] px-4 py-1.5 flex items-center justify-between">
      <span class="scale-text-xs font-bold tracking-wider">台東 ➔ 綠島｜四日慢旅核心歷史事件導覽</span>
      <span class="scale-text-xs font-mono text-[#F7E8C4]" id="topProgressBadge">STAGE 1 / 7</span>
    </div>

    <!-- 頂部主標題與工具按鈕列 -->
    <header class="px-4 pt-3.5 pb-3 border-b-[2.5px] border-[#2C2A29] bg-[#FAF7F2] sticky top-0 z-30">
      <div class="flex items-start justify-between gap-2 mb-3">
        <div>
          <h1 class="scale-text-lg font-black text-[#2C2A29] leading-tight">
            1970 泰源事件：互動歷史時間軸
          </h1>
          <p class="scale-text-xs font-bold text-[#6E6A66] mt-0.5">
            👇 按一下推進時間，走進山海交界的自由約定
          </p>
        </div>

        <!-- 右上角兩顆工具按鈕：人物關係表 & 大字模式 -->
        <div class="flex items-center gap-1.5 shrink-0">
          <button onclick="openCastModal()" class="sketch-pill sketch-btn bg-[#F7E8C4] px-2.5 py-1.5 scale-text-xs font-black text-[#2C2A29] flex items-center gap-1" title="查看泰源事件人物關係網">
            <span>👥</span>
            <span>人物表</span>
          </button>
          <button id="largeTextBtn" onclick="toggleLargeText()" class="sketch-pill sketch-btn bg-[#E2ECE4] px-2.5 py-1.5 scale-text-xs font-black text-[#2C2A29] flex items-center gap-1" title="切換長輩適讀大字體">
            <span>🔍</span>
            <span id="largeTextLabel">大字</span>
          </button>
        </div>
      </div>

      <!-- 7 幕水平進度軸 (7-Step Interactive Stepper) -->
      <div class="relative pt-6 pb-1 px-2 select-none">
        <!-- 底層連線與動態填色進度條 -->
        <div class="relative mx-4 h-[4px] bg-[#DDD6C7] rounded-full top-[11px] z-0 overflow-hidden border border-[#2C2A29]">
          <div id="stepperFillBar" class="h-full bg-[#E8998D] transition-all duration-300" style="width: 0%;"></div>
        </div>

        <!-- 隨進度移動的手繪火種/小船圖示 -->
        <div id="stepperMascot" class="stepper-mascot absolute top-[1px] z-20 -translate-x-1/2 pointer-events-none" style="left: 7.14%;">
          <div class="px-1.5 py-0.5 rounded-md bg-[#2C2A29] text-[#FAF7F2] text-[10px] font-black shadow-sm whitespace-nowrap" id="mascotTag">
            第 1 幕
          </div>
        </div>

        <!-- 7 個可點擊的章節圓點 -->
        <div class="grid grid-cols-7 relative z-10" id="stepperDotsContainer">
          <!-- 由 JS 動態渲染 7 個圓點 -->
        </div>
      </div>
    </header>

    <!-- 主舞台內容區 (Story Stage) -->
    <main class="px-4 pt-4 pb-6 flex-1" id="stageContainer">
      <!-- 由 JS 根據當前幕次 (0~6) 動態渲染 -->
    </main>

    <!-- 已解鎖的歷史軌跡回顧折疊夾 (History Log) -->
    <section class="px-4 pb-6">
      <div class="sketch-box bg-[#EFECE4] p-3.5">
        <div class="flex items-center justify-between mb-2">
          <span class="scale-text-xs font-black text-[#2C2A29] flex items-center gap-1.5">
            <span>🧭</span>
            <span>已推進的事件軌跡（點擊可快速跳回該幕）</span>
          </span>
          <span id="unlockedCountLabel" class="scale-text-xs font-bold text-[#6E6A66]">已解鎖 1 / 7</span>
        </div>
        <div id="historyBreadcrumbList" class="flex flex-wrap gap-1.5">
          <!-- 由 JS 渲染已解鎖的章節小標籤 -->
        </div>
      </div>
    </section>

    <!-- 底部固定推進控制列 (Bottom Action Bar) -->
    <footer class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full max-w-[520px] bg-[#FAF7F2]/95 backdrop-blur-sm border-t-[2.5px] border-[#2C2A29] px-4 py-3 z-40">
      <div class="flex items-center gap-2.5">
        <!-- 上一幕按鈕 -->
        <button id="prevStageBtn" onclick="prevStage()" class="sketch-box sketch-btn bg-white px-3.5 py-3 font-black scale-text-sm text-[#2C2A29] disabled:opacity-40 disabled:pointer-events-none shrink-0" aria-label="上一幕">
          ⬅️ 上一幕
        </button>

        <!-- 主推進按鈕：按一下推進一次事件進度 -->
        <button id="nextStageBtn" onclick="nextStage()" class="sketch-box sketch-btn flex-1 bg-[#E8998D] py-3 px-4 font-black scale-text-base text-[#2C2A29] flex items-center justify-center gap-2">
          <span id="nextStageBtnText">👉 按一下推進下一幕 (1/7)</span>
        </button>
      </div>
    </footer>
  </div>

  <!-- ==================== 彈出視窗：人物關係與演員表 (Cast Modal) ==================== -->
  <div id="castModalBackdrop" class="fixed inset-0 bg-black/55 z-50 hidden flex items-center justify-center p-3 sm:p-4 backdrop-blur-[2px]" onclick="closeCastModal(event)">
    <div class="sketch-box bg-[#FAF7F2] w-full max-w-[460px] max-h-[88vh] flex flex-col overflow-hidden" onclick="event.stopPropagation()">
      <!-- Modal 標題列 -->
      <div class="bg-[#F7E8C4] px-4 py-3.5 border-b-[2.5px] border-[#2C2A29] flex items-center justify-between">
        <div class="flex items-center gap-2">
          <span class="text-xl">👥</span>
          <div>
            <h2 class="scale-text-base font-black text-[#2C2A29]">1970 泰源事件：核心人物與關係網</h2>
            <p class="scale-text-xs font-bold text-[#5A5652]">跨越鐵窗的政治犯與台東阿美族青年</p>
          </div>
        </div>
        <button onclick="closeCastModal()" class="w-8 h-8 rounded-full bg-white border-2 border-[#2C2A29] font-black text-base flex items-center justify-center shadow-[0_2px_0_#2C2A29]">
          ✕
        </button>
      </div>

      <!-- 人物關係卡片列表 -->
      <div class="p-4 overflow-y-auto space-y-3" id="castModalContent">
        <!-- 由 JS 渲染 -->
      </div>
    </div>
  </div>

    // =========================================================================
    // 4. 渲染頂部 7 幕進度軸與主舞台卡片
    // =========================================================================
    function renderStepperDots() {
      const container = document.getElementById('stepperDotsContainer');
      container.innerHTML = TAIYUAN_STAGES.map((st, idx) => {
        const isCurrent = idx === currentStepIndex;
        const isPassed = idx <= maxUnlockedIndex;
        const dotBg = isCurrent ? 'bg-[#E8998D] scale-125' : (isPassed ? 'bg-[#E2ECE4]' : 'bg-[#FAF7F2]');
        return `
          <button onclick="goToStage(${idx})" class="flex flex-col items-center group focus:outline-none">

              ${idx + 1}

            <span class="mt-1.5 text-[11px] font-bold ${isCurrent ? 'text-[#2C2A29] font-black underline' : 'text-[#6E6A66]'}">
              ${st.shortName}
            </span>
          </button>
        `;
      }).join('');
    }

    function renderStage(index) {
      stopSpeech();
      currentStepIndex = index;
      if (index > maxUnlockedIndex) {

      }

      document.getElementById('topProgressBadge').textContent = `STAGE ${index + 1} / 7`;
      const fillPct = (index / (TAIYUAN_STAGES.length - 1)) * 100;
      document.getElementById('stepperFillBar').style.width = `${fillPct}%`;

      const mascotPositions = ["7.14%", "21.42%", "35.71%", "50%", "64.28%", "78.57%", "92.85%"];
      const mascot = document.getElementById('stepperMascot');
      if (mascot) mascot.style.left = mascotPositions[index];

      renderHistoryBreadcrumbs();

      // 2. 渲染主舞台內容 (Story Stage)

    function revealStageChoice(selectedIdx, correctIdx) {
      for (let i = 0; i < 3; i++) {

        if (i === correctIdx) {
          btn.className = "w-full text-left p-2.5 rounded-xl border-2 border-[#2C2A29] bg-[#CBE4D6] scale-text-xs font-black text-[#2C2A29]";

          btn.className = "w-full text-left p-2.5 rounded-xl border-2 border-[#2C2A29] bg-[#F5C2B8] scale-text-xs font-bold text-[#2C2A29]";

      const revealBox = document.getElementById('stageChoiceRevealBox');
      if (revealBox) revealBox.classList.remove('hidden');

    // 第 7 幕結束時的「台東到綠島四天三夜行程總對照卡」

      return `

    // =========================================================================
    // 5. 推進控制邏輯 (下一幕 / 上一幕 / 跳轉章節)
    // =========================================================================
    function nextStage() {
      if (currentStepIndex < TAIYUAN_STAGES.length - 1) {
        renderStage(currentStepIndex + 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      } else {
        // 在第 7 幕點擊時重新回到第 1 幕
        renderStage(0);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function prevStage() {
      if (currentStepIndex > 0) {
        renderStage(currentStepIndex - 1);
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    }

    function goToStage(index) {
      renderStage(index);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function updateFooterButtons() {
      const prevBtn = document.getElementById('prevStageBtn');
      const nextBtn = document.getElementById('nextStageBtn');
      const nextBtnText = document.getElementById('nextStageBtnText');

      prevBtn.disabled = currentStepIndex === 0;

      if (currentStepIndex < TAIYUAN_STAGES.length - 1) {
        const nextStepTitle = TAIYUAN_STAGES[currentStepIndex + 1].shortName;
        nextBtn.className = "sketch-box sketch-btn flex-1 bg-[#E8998D] py-3 px-4 font-black scale-text-base text-[#2C2A29] flex items-center justify-center gap-2";
        nextBtnText.textContent = `👉 推進下一幕：${nextStepTitle} (${currentStepIndex + 1}/7)`;
      } else {
        nextBtn.className = "sketch-box sketch-btn flex-1 bg-[#E2ECE4] py-3 px-4 font-black scale-text-base text-[#2C2A29] flex items-center justify-center gap-2";
        nextBtnText.textContent = `🔄 已讀完第 7 幕・從頭回顧 (7/7)`;
      }
    }

    function renderHistoryBreadcrumbs() {
      const countLabel = document.getElementById('unlockedCountLabel');
      countLabel.textContent = `已解鎖 ${maxUnlockedIndex + 1} / 7`;

      const listEl = document.getElementById('historyBreadcrumbList');
      listEl.innerHTML = TAIYUAN_STAGES.map((st, idx) => {
        const isUnlocked = idx <= maxUnlockedIndex;
        const isCurrent = idx === currentStepIndex;
        if (!isUnlocked) {
          return `
            <span class="px-2.5 py-1 rounded-lg border border-dashed border-[#2C2A29]/40 scale-text-xs text-[#8C8680] select-none">
              🔒 第 ${idx + 1} 幕
            </span>
          `;
        }
        return `
          <button onclick="goToStage(${idx})" class="px-2.5 py-1 rounded-lg border-2 border-[#2C2A29] scale-text-xs font-bold transition-all ${isCurrent ? 'bg-[#E8998D] font-black shadow-[2px_2px_0_#2C2A29]' : 'bg-white hover:bg-[#F7E8C4]'}">
            ${idx + 1}. ${st.shortName}
          </button>
        `;
      }).join('');
    }

    // =========================================================================
    // 6. Web Speech API 語音朗讀導覽 & 大字模式 & 人物關係彈窗
    // =========================================================================
    function toggleStageSpeech() {
      if (!('speechSynthesis' in window)) {
        return;
      }

      if (isSpeaking) {
        stopSpeech();
        return;
      }

      const data = TAIYUAN_STAGES[currentStepIndex];
      window.speechSynthesis.cancel();

      const textToRead = `${data.actLabel}，${data.title}。${data.narrative.replace(/\n/g, ' ')}`;
      const utterance = new SpeechSynthesisUtterance(textToRead);
      utterance.lang = 'zh-TW';
      utterance.rate = 0.92;

      utterance.onstart = () => {
        isSpeaking = true;
        updateSpeechButtonUI(true);
      };
      utterance.onend = () => {
        isSpeaking = false;
        updateSpeechButtonUI(false);
      };
      utterance.onerror = () => {
        isSpeaking = false;
        updateSpeechButtonUI(false);
      };

      window.speechSynthesis.speak(utterance);
    }

    function stopSpeech() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      isSpeaking = false;
      updateSpeechButtonUI(false);
    }

    function updateSpeechButtonUI(speaking) {
      const btn = document.getElementById('ttsBtn');
      const icon = document.getElementById('ttsIcon');
      const label = document.getElementById('ttsLabel');
      if (!btn) return;

      if (speaking) {
        btn.className = "sketch-pill sketch-btn bg-[#F7E8C4] px-3 py-1 scale-text-xs font-black text-[#2C2A29] flex items-center gap-1 speaking-active";
        icon.textContent = "⏹️";
        label.textContent = "停止朗讀";
      } else {
        btn.className = "sketch-pill sketch-btn bg-[#FAF7F2] px-3 py-1 scale-text-xs font-black text-[#2C2A29] flex items-center gap-1";
        icon.textContent = "🔊";
        label.textContent = "語音導讀";
      }
    }

    function toggleLargeText() {
      isLargeText = !isLargeText;
      document.body.classList.toggle('large-text-mode', isLargeText);
      const btn = document.getElementById('largeTextBtn');
      const label = document.getElementById('largeTextLabel');
      if (isLargeText) {
        btn.classList.replace('bg-[#E2ECE4]', 'bg-[#E8998D]');
        label.textContent = "標準字";
      } else {
        btn.classList.replace('bg-[#E8998D]', 'bg-[#E2ECE4]');
        label.textContent = "大字";
      }
    }

          <p class="scale-text-xs text-[#4A4745] font-medium leading-relaxed">
            ${item.desc}
          </p>
        </div>
      `).join('');
    }

    function openCastModal() {
      document.getElementById('castModalBackdrop').classList.remove('hidden');
    }

    function closeCastModal(e) {
      if (!e || e.target.id === 'castModalBackdrop') {
        document.getElementById('castModalBackdrop').classList.add('hidden');
      }
    }
  </script>
</body>
</html>
